services:
  # Base de datos MariaDB
  database:
    image: mariadb:10.11
    container_name: gestgym-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marce
      TZ: America/Mexico_City
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - gestgym-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend - API en Go
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestgym-backend
    restart: unless-stopped
    environment:
      # Base de datos
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: marce

      # Servidor
      PORT: 5000
      GIN_MODE: release
      APP_ENV: production
      ENV: production

      # JWT
      JWT_SECRET: yoyo

      # URLs de la aplicación
      FRONTEND_URL: http://localhost:3000
      BASE_URL: http://localhost:5000

      # Email SMTP
      EMAIL_FROM: marcelinho.nelson@gmail.com
      EMAIL_PASSWORD: elloalmsgopmymqy
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      CONTACT_EMAIL: marcelinho.nelson@gmail.com
      CONTACT_RECIPIENT: 2318524@ucc.edu.ar
      MOCK_EMAIL: false

      # Timezone
      TZ: America/Mexico_City
    ports:
      - "5000:5000"
    volumes:
      - backend_static:/app/static
      - backend_logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - gestgym-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - React con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: gestgym-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000
      TZ: America/Mexico_City
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gestgym-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volúmenes persistentes
volumes:
  mariadb_data:
    driver: local
    name: gestgym-mariadb-data
  backend_static:
    driver: local
    name: gestgym-backend-static
  backend_logs:
    driver: local
    name: gestgym-backend-logs

# Red interna para comunicación entre servicios
networks:
  gestgym-network:
    driver: bridge
    name: gestgym-network
